{% extends "base.html" %} {% block titre %}Réaliser Intervention{% endblock %}
{% block contenu %}
<h4 class="text-muted mb-4">
  Réaliser l'intervention pour l'ordre {{ ordre.numero_ordre }}
</h4>

<form method="post">
  {% csrf_token %}
  <div class="card p-4 bg-white">
    <p>Confirmer la réalisation de cette intervention.</p>
    <button class="btn btn-primary">Marquer comme réalisée</button>
    <a
      href="{% url 'conventionnement:detail_ordre' ordre.id %}"
      class="btn btn-secondary ms-2"
      >Annuler</a
    >
  </div>
</form>
{% endblock %}
